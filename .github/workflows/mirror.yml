name: Mirror to clipbin/code

on:
  push:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror repository
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git clone --mirror https://github.com/saaranshDx/clipbin.git mirror.git
          git -C mirror.git push --mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/clipbin/code.git"
            