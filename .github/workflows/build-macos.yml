name: Build CLI (macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller requests cryptography

      - name: Build executable
        run: pyinstaller --onefile --name clipbin cli/main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: clipbin-macos
          path: dist/clipbin
