<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clipbin</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="toast"></div>
    <div class="app">
      <header>
        <h1>clipbin</h1>
        <div class="controls">
          <select id="duration">
            <option value="1">1 hour</option>
            <option value="24">24 hours</option>
            <option value="72">3 days</option>
            <option value="168" selected>7 days</option>
          </select>
          <button id="submit-data" onclick="uploadPaste()">create paste</button>
          <a href="https://github.com/SaaranshDx/clipbin" target="_blank" class="icon-btn" title="GitHub">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          </a>
          <a href="#" class="icon-btn" title="CLI" onclick="comingSoon(); return false;">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2 3a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3zm2 2v14h16V5H4zm3.5 3.5l4 2.5-4 2.5v-5zm2 4l4-2.5-4-2.5v5z"/></svg>
          </a>
        </div>
      </header>
      <textarea id="data-feild" placeholder="paste something..."></textarea>
      <div class="result" id="result" hidden>
        <input type="text" id="paste-url" readonly>
        <button id="copy-btn" onclick="copyLink()" title="copy link">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 1H4a1 1 0 0 0-1 1v14h2V3h12V1zm3 4H8a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
